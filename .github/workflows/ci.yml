name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Empty database: every run proves the migrations build the schema from scratch.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hrvo_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # ADR 021: AWS KMS emulator for the KMS key provider tests.
      kms:
        image: motoserver/moto:5.2.3
        ports:
          - 4566:5000

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      KMS_TEST_ENDPOINT: http://127.0.0.1:4566
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/hrvo_dev?schema=public
      DATABASE_URL: postgresql://hrvo_app:hrvo_app_ci_pass@localhost:5433/hrvo_dev?schema=public
      PGHOST: localhost
      PGPORT: 5433
      PGDATABASE: hrvo_dev
      PGUSER: hrvo_app
      PGPASSWORD: hrvo_app_ci_pass
      PGADMIN_USER: postgres
      PGADMIN_PASSWORD: postgres
      PGRETENTION_USER: hrvo_retention
      PGRETENTION_PASSWORD: hrvo_retention_ci_pass
      CORS_ORIGINS: http://localhost:3000
      BREACHED_PASSWORD_CHECK: local
      MAIL_TRANSPORT: memory
      # Inline emails, no schedulers; test/jobs-bullmq-e2e.test.ts turns jobs on against the redis service.
      JOBS_ENABLED: 'false'
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # Documents (ADR 009): S3-compatible storage and clamd started below; KMS key per run.
      S3_ENDPOINT: http://localhost:8333
      S3_ACCESS_KEY: hrvo-ci
      S3_SECRET_KEY: hrvo-ci-only-secret
      S3_BUCKET: hrvo-documents
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      S3_CREATE_BUCKET: 'true'
      CLAMAV_HOST: localhost
      CLAMAV_PORT: 3310
      # The suites sign the same people in and open documents many times per minute.
      RATE_LIMIT_VAULT: '500'
      RATE_LIMIT_SHARE: '500'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # SRS 10.3: secret scanning in CI. Historic, accepted findings live in .gitleaksignore.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: 'false'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate per-run JWT secret and document KMS key (no secrets in the repository)
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DOCUMENT_KMS_LOCAL_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "DOCUMENT_KMS_RECOVERY_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      # Started as steps: SeaweedFS needs command arguments, which job services cannot pass.
      - name: Start S3-compatible storage (SeaweedFS) and ClamAV
        run: |
          printf '{"identities":[{"name":"ci","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$S3_ACCESS_KEY" "$S3_SECRET_KEY" > "$RUNNER_TEMP/s3.json"
          docker run -d --name s3 -p 8333:8333 -v "$RUNNER_TEMP/s3.json:/etc/s3.json:ro" chrislusf/seaweedfs:4.48 \
            server -ip=127.0.0.1 -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333 -s3.config=/etc/s3.json
          docker run -d --name clamav -p 3310:3310 clamav/clamav:1.4

      # ADR 016: test/meetings-e2e.test.ts checks that a real LiveKit accepts the tokens the API issues.
      # Same dev config as docker-compose (dev key only; LiveKit reaches the redis service on 6379).
      - name: Start LiveKit
        run: |
          docker run -d --name livekit --network host -v "$GITHUB_WORKSPACE/infra/livekit/livekit.dev.yaml:/etc/livekit.yaml:ro" \
            livekit/livekit-server:v1.9.1 --config /etc/livekit.yaml
          for i in $(seq 1 30); do curl -sf http://localhost:7880 >/dev/null && exit 0; sleep 2; done
          docker logs livekit; exit 1

      - name: Validate Prisma schema and generate client
        run: |
          npx prisma validate --schema apps/api/prisma/schema.prisma
          npm run db:generate

      - name: Apply migrations to empty database (Prisma Migrate)
        run: npm run db:migrate

      - name: Provision application role logins
        run: npm run db:provision-roles

      - name: Fail on drift between migrations and schema.prisma
        run: npx prisma migrate diff --from-url "$DIRECT_DATABASE_URL" --to-schema-datamodel apps/api/prisma/schema.prisma --exit-code

      - name: Lint (API, shared, web)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Wait for S3 and clamd
        run: |
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8333/ && break; sleep 2; done
          for i in $(seq 1 90); do docker logs clamav 2>&1 | grep -qE "Listening daemon|socket found, clamd started" && break; sleep 5; done
          docker logs clamav 2>&1 | tail -3

      - name: Run test suite with coverage
        run: npm run test:coverage

      - name: Typecheck web app
        run: npm run web:typecheck

      - name: Desktop agent unit tests (ADR 018)
        run: npm test -w @hrvo/agent

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Web end-to-end tests (real API + Postgres)
        env:
          CI: 'true'
        # xvfb: the desktop agent spec (19) runs the real Electron app, which needs a display.
        run: xvfb-run -a npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # ADR 020: Terraform format and validation only. No credentials, no plan, no apply.
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate (no backend, no credentials)
        run: |
          for d in infra/terraform/bootstrap infra/terraform/envs/staging infra/terraform/envs/production; do
            terraform -chdir="$d" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$d" validate
          done

  # ADR 020: the container images build (not pushed anywhere).
  images:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build API, migrate and web images
        run: |
          docker build -f docker/api.Dockerfile --target api -t hrvo-api:ci .
          docker build -f docker/api.Dockerfile --target migrate -t hrvo-api:ci-migrate .
          docker build -f docker/web.Dockerfile --target web -t hrvo-web:ci \
            --build-arg NEXT_PUBLIC_API_URL=https://api.example.invalid --build-arg NEXT_PUBLIC_LIVEKIT_URL=wss://livekit.example.invalid .

  # ADR 018: unsigned desktop agent installers for review. Building only; nothing is published.
  # Code signing (Windows certificate, Apple notarisation) is a release step that needs secrets.
  agent-installers:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.script }} -w @hrvo/agent

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: hrvo-agent-${{ matrix.os }}
          path: |
            apps/agent/release/*.AppImage
            apps/agent/release/*.deb
            apps/agent/release/*.exe
            apps/agent/release/*.dmg
          if-no-files-found: error
          retention-days: 14
