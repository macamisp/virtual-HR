name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hrvo_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize Database Schema & RLS
        env:
          PGHOST: localhost
          PGPORT: 5433
          PGDATABASE: hrvo_dev
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5433 -U postgres -d hrvo_dev -f apps/api/src/attendance/schema.sql

      - name: Run Test Suite & Coverage
        env:
          PGHOST: localhost
          PGPORT: 5433
          PGDATABASE: hrvo_dev
          PGUSER: hrvo_app
          PGPASSWORD: hrvo_app_pass
          PGADMIN_USER: postgres
          PGADMIN_PASSWORD: postgres
          PGRETENTION_USER: hrvo_retention
          PGRETENTION_PASSWORD: hrvo_retention_dev
          JWT_SECRET: test-jwt-secret-min-32-characters-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-min-32-characters-long
        run: npm run test:coverage
