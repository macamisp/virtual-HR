# Drop-in for docker.service: /etc/systemd/system/docker.service.d/hrvo-imds-guard.conf (ADR 047).
# Docker starts after the instance-metadata guard and refuses to start without it, so no container
# ever runs unguarded (fail closed). Remove this file first when rolling back.
[Unit]
Wants=hrvo-imds-guard.service
After=hrvo-imds-guard.service

[Service]
EnvironmentFile=-/etc/default/hrvo-imds-guard
ExecStartPre=/usr/local/sbin/hrvo-imds-guard check
