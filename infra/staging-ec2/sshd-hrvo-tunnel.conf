# /etc/ssh/sshd_config.d/50-hrvo-tunnel.conf (ADR 047). Testers sign in to accounts whose primary
# group is hrvo-tunnel. They may only forward to the three loopback ports of the staging app: no
# shell, no other forwarding, no agent, no X11. Sign-in for everyone else (ubuntu, EC2 Instance
# Connect, Session Manager) is unchanged. Check with `sudo sshd -t` before reloading.
Match Group hrvo-tunnel
	AllowTcpForwarding local
	PermitOpen 127.0.0.1:3000 127.0.0.1:3001 127.0.0.1:8333
	PermitListen none
	AllowStreamLocalForwarding no
	AllowAgentForwarding no
	X11Forwarding no
	PermitTTY no
	PermitUserRC no
	ForceCommand /usr/sbin/nologin
