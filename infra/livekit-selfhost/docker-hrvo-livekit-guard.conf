# Drop-in for docker.service: /etc/systemd/system/docker.service.d/hrvo-livekit-guard.conf (ADR 067).
# Docker starts after the LiveKit guard and refuses to start without it, so a restarted LiveKit
# container never runs unguarded (fail closed, like ADR 047's hrvo-imds-guard drop-in). Remove this
# file first when rolling back the self-hosted LiveKit stack.
[Unit]
Wants=hrvo-livekit-guard.service
After=hrvo-livekit-guard.service

[Service]
# The one mandatory settings file (missing or malformed: the guard fails, so this fails closed).
Environment=HRVO_LIVEKIT_GUARD_SETTINGS=/etc/default/hrvo-livekit-guard
# `check` never calls Docker (no socket-activation wait while docker.service starts).
ExecStartPre=/usr/local/sbin/hrvo-livekit-guard check
