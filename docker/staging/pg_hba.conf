# Staging PostgreSQL client authentication (ADR 046).
# Unix socket inside the container only (initialisation and pg_isready).
local   all   all                 trust
# Network clients: TLS and SCRAM, nothing else.
hostssl all   all   0.0.0.0/0     scram-sha-256
hostssl all   all   ::/0          scram-sha-256
host    all   all   0.0.0.0/0     reject
host    all   all   ::/0          reject
