services:
  postgres:
    image: postgres:16-alpine
    container_name: hrvo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hrvo_dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hrvo_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hrvo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for documents. SeaweedFS, the same image CI uses (MinIO no longer
  # publishes its community images). The keys come from .env (S3_ACCESS_KEY / S3_SECRET_KEY, the
  # same values the API uses); listens on localhost only.
  storage:
    image: chrislusf/seaweedfs:4.48
    container_name: hrvo-storage
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"hrvo","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -ip=127.0.0.1 -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "127.0.0.1:9000:8333"
    volumes:
      - storage_data:/data

  clamav:
    image: clamav/clamav:1.4
    container_name: hrvo-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"

  # ADR 021: a local AWS KMS emulator (moto) to try DOCUMENT_KMS_PROVIDER=aws without AWS.
  kms:
    image: motoserver/moto:5.2.3
    container_name: hrvo-kms
    restart: unless-stopped
    ports:
      - "4566:5000"

  # ADR 016: WebRTC SFU for meetings, rooms and proximity audio/video (local dev only).
  livekit:
    image: livekit/livekit-server:v1.9.1
    command: ["--config", "/etc/livekit.yaml"]
    network_mode: host
    depends_on:
      - redis
    volumes:
      - ./infra/livekit/livekit.dev.yaml:/etc/livekit.yaml:ro,z

  # ADR 024: meeting recording (FR-MEET-007). Optional and large (~1.3 GB, headless Chrome):
  # `docker compose --profile recording up -d`, then enable recording in Admin > Data retention.
  livekit-egress:
    image: livekit/egress:v1.10.0
    profiles: ["recording"]
    network_mode: host
    depends_on:
      - livekit
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./infra/livekit/egress.dev.yaml:/etc/egress.yaml:ro,z

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: hrvo-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  postgres_data:
  redis_data:
  storage_data:
